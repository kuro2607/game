<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Catcher</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--text:#2b2430;--accent:#f5a623;--c1:#ffe27a;--c2:#f5a623;--muted:#8a7f93;--line:#eadfc8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1722;--card:#2a2433;--text:#f3eefa;--muted:#a79bb5;--line:#3a3245}}
:root[data-theme="dark"]{--bg:#1b1722;--card:#2a2433;--text:#f3eefa;--muted:#a79bb5;--line:#3a3245}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:480px;padding:12px;user-select:none;-webkit-user-select:none}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
#score{font-size:28px;color:var(--accent)}
.bar{display:flex;justify-content:space-between;margin:6px 0;font-size:14px;color:var(--muted)}
#field{position:relative;height:300px;overflow:hidden;background:var(--card);border:2px solid var(--line);border-radius:14px;touch-action:manipulation}
.coin{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--c1),var(--c2));border:3px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-weight:700;top:-50px;transition:top 4s linear;font-size:20px}
.coin.bomb{background:#333;border-color:#c00}
.pop{position:absolute;font-weight:700;pointer-events:none;transition:all .6s}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
#ov button{background:var(--accent);color:#2b2430;border:0;font-weight:700;padding:12px 28px}
.shop{display:grid;gap:8px;margin-top:12px}
button{font:inherit;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;justify-content:center;padding:8px;font-size:13px}
small{color:var(--muted)}
</style>
</head>
<body>
<div class="top"><span>🪙 Coin Catcher</span><span id="score">0</span></div>
<div class="bar"><span id="lvl"></span><span id="time"></span><span id="hp"></span></div>
<div id="field"><div id="ov"></div></div>
<div class="shop">
  <button id="bv"><span>💪 Coin value <small id="lv"></small></span><b id="cv"></b></button>
  <button id="br"><span>⚡ Spawn speed <small id="lr"></small></span><b id="cr"></b></button>
</div>
<div class="row"><button data-t="gold">🟡 Gold</button><button data-t="neon">🟣 Neon</button><button data-t="forest">🟢 Forest</button><button id="mute">🔊</button></div>
<script>
var KEY="coinCatcherSave2",S={coins:0,value:1,rate:0,total:0,best:0,theme:"gold",mute:false};
try{var p=JSON.parse(localStorage.getItem(KEY)||"{}");for(var k in S)if(p[k]!==undefined)S[k]=p[k];}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var $=function(i){return document.getElementById(i)},field=$("field"),ov=$("ov");
var THEMES={gold:["#ffe27a","#f5a623"],neon:["#f0a6ff","#9b3df5"],forest:["#b6f5a0","#2e9e4f"]};
function theme(){var t=THEMES[S.theme];var r=document.documentElement.style;r.setProperty("--c1",t[0]);r.setProperty("--c2",t[1]);r.setProperty("--accent",t[1]);$("mute").textContent=S.mute?"🔇":"🔊"}
var AC=null;
function beep(f,d){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function level(){return 1+Math.floor(S.total/100)}
function costV(){return Math.round(10*Math.pow(1.6,S.value-1))}
function costR(){return Math.round(15*Math.pow(1.7,S.rate))}
var R={on:false,t:0,hp:3,got:0,timer:null,sp:null};
function ui(){
  $("score").textContent=S.coins;$("lvl").textContent="Level "+level()+" · Best "+S.best;
  $("time").textContent="⏱ "+R.t+"s";$("hp").textContent="❤️".repeat(R.hp)||"💀";
  $("lv").textContent="(+"+S.value+")";$("lr").textContent="(lvl "+(S.rate+1)+")";
  $("cv").textContent=costV()+" 🪙";$("cr").textContent=costR()+" 🪙";
  $("bv").disabled=S.coins<costV();$("br").disabled=S.coins<costR();
}
function pop(e,txt,col){var r=field.getBoundingClientRect(),p=document.createElement("div");p.className="pop";p.textContent=txt;p.style.color=col;p.style.left=(e.clientX-r.left)+"px";p.style.top=(e.clientY-r.top)+"px";field.appendChild(p);requestAnimationFrame(function(){p.style.top=(e.clientY-r.top-40)+"px";p.style.opacity=0});setTimeout(function(){p.remove()},700)}
function spawn(){
  var bomb=Math.random()<Math.min(.35,.06+.03*level()),c=document.createElement("div");
  c.className="coin"+(bomb?" bomb":"");c.textContent=bomb?"💣":"$";
  c.style.left=Math.random()*(field.clientWidth-44)+"px";field.appendChild(c);
  requestAnimationFrame(function(){requestAnimationFrame(function(){c.style.top=field.clientHeight+"px"})});
  var gone=setTimeout(function(){c.remove()},4100);
  c.onpointerdown=function(e){
    e.preventDefault();if(!R.on)return;clearTimeout(gone);c.remove();
    if(bomb){R.hp--;beep(120,.25);pop(e,"-❤️","#e33");if(R.hp<=0)end();}
    else{S.coins+=S.value;S.total+=S.value;R.got+=S.value;beep(660,.08);pop(e,"+"+S.value,"var(--accent)");}
    save();ui();
  };
}
function loop(){if(!R.on)return;spawn();R.sp=setTimeout(loop,1300/(1+.35*S.rate))}
function start(){R.on=true;R.t=45;R.hp=3;R.got=0;ov.style.display="none";ui();loop();
  R.timer=setInterval(function(){R.t--;if(R.t<=0)end();ui()},1000)}
function end(){
  if(!R.on)return;R.on=false;clearInterval(R.timer);clearTimeout(R.sp);
  var nb=R.got>S.best;if(nb)S.best=R.got;save();ui();
  ov.style.display="flex";ov.innerHTML="<h2>Round over</h2><div>Caught "+R.got+" 🪙"+(nb?" — new best! 🎉":"")+"</div><button id='go'>Play again</button>";
  $("go").onclick=start;
}
ov.innerHTML="<h2>Coin Catcher</h2><div>45 seconds. Catch coins, avoid 💣.<br>3 hearts. Bombs get more common each level.</div><button id='go'>Start</button>";
$("go").onclick=start;
$("bv").onclick=function(){var c=costV();if(S.coins>=c){S.coins-=c;S.value++;beep(880,.1);save();ui()}};
$("br").onclick=function(){var c=costR();if(S.coins>=c){S.coins-=c;S.rate++;beep(880,.1);save();ui()}};
$("mute").onclick=function(){S.mute=!S.mute;save();theme()};
document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){S.theme=b.dataset.t;save();theme()}});
theme();ui();
</script>
</body>
</html>
